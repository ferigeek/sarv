<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/dist/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Sarv Analytics</title>
    <link rel="stylesheet" href="/static/dist/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
      .login-card { width: 100%; max-width: 380px; }
      .login-card .brand-text { color: var(--sarv-ink); }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <div class="card login-card"><div class="card-body p-4">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong class="brand-text">Sarv<small>Analytics</small></strong>
        </div>
        <h1 class="card-title mt-2">Sign in</h1>
        <p class="card-subtitle">Internal dashboard — authorized access only.</p>
        {% if error %}
        <p class="alert alert-danger" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login">
          <div class="mb-2">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div></div>
    </main>
  </body>
</html>
